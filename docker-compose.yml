# Optional: `docker compose up -d` — same ports as run.sh/run.bat (loadopt_minio).
# If you use run.sh, it starts its own container; avoid running both on the same ports.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  minio_data:
